name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # The environment name must match the one registered with the PyPI
    # trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/racer-raman
    permissions:
      # Mints the short-lived OIDC token PyPI trusts. No API token is stored.
      id-token: write
    steps:
      # Deliberately no checkout: nothing from the repository runs in the job
      # that holds the publishing credential.
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
